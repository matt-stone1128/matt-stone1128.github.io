<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3ed" />
    <meta
      name="description"
      content="Explore Stone Construction remodeling galleries."
    />
    <title>Project Gallery | Stone Construction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="gallery.js" defer></script>
  </head>
  <body class="gallery-page">
    <header class="gallery-header">
      <a
        class="wordmark gallery-wordmark"
        href="index.html"
        aria-label="Stone Construction home"
      >
        <span class="wordmark-icon" aria-hidden="true">S</span>
        <span class="wordmark-text">STONE<span>CONSTRUCTION</span></span>
      </a>
      <a class="gallery-back" href="index.html#services"
        ><span aria-hidden="true">←</span> ALL SERVICES</a
      >
    </header>
    <main>
      <section class="gallery-intro section-wrap">
        <p class="eyebrow">
          <span class="eyebrow-mark" id="gallery-number">01</span> STONE
          CONSTRUCTION / PROJECT GALLERY
        </p>
        <h1 id="gallery-title">Project gallery</h1>
        <p id="gallery-description">Thoughtful spaces, made for living.</p>
      </section>
      <section
        class="gallery-content section-wrap"
        aria-label="Project photographs"
      >
        <div class="gallery-grid" id="gallery-grid"></div>
      </section>
      <section class="gallery-contact section-wrap">
        <div>
          <p class="eyebrow">
            <span class="eyebrow-mark">SC</span> SEE SOMETHING YOU LOVE?
          </p>
          <h2>Let’s make it <em>yours.</em></h2>
        </div>
        <a class="button button-dark" href="index.html#contact"
          >Talk about your project <span aria-hidden="true">↗</span></a
        >
      </section>
    </main>
    <footer class="gallery-footer">
      <a href="index.html">STONE CONSTRUCTION</a
      ><a href="index.html#home">BACK TO HOME ↑</a>
    </footer>
    <dialog class="lightbox" id="lightbox" aria-label="Expanded project photo">
      <button class="lightbox-close" type="button" aria-label="Close photo">
        ×
      </button>
      <img id="lightbox-image" alt="" />
      <p id="lightbox-caption"></p>
    </dialog>
  </body>
</html>
